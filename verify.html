<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشتڕاستکردنەوەی OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            text-align: center;
            font-size: 24px;
            letter-spacing: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0b7dda;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>پشتڕاستکردنەوەی OTP</h2>
        <div id="info" class="message info" style="display: block;"></div>
        <form id="verifyForm">
            <input type="text" id="otp" placeholder="کۆدی 6 ژمارەیی" maxlength="6" required>
            <button type="submit">پشتڕاستکردنەوە</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        const tempEmail = localStorage.getItem('tempEmail');
        const tempOtp = localStorage.getItem('tempOtp');
        const tempUserName = localStorage.getItem('tempUserName');
        
        document.getElementById('info').innerHTML = `
            📧 ئیمەیڵ: ${tempEmail}<br>
            👤 ناوی بەکارهێنەر: ${tempUserName}<br>
            🔑 OTP نێردراو: ${tempOtp}
        `;
        
        document.getElementById('verifyForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const enteredOtp = document.getElementById('otp').value;
            const messageDiv = document.getElementById('message');
            
            if (enteredOtp === tempOtp) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'message success';
                messageDiv.innerHTML = `✅ OTP پشتڕاست کرایەوە!<br>🎉 بەخێربێیت ${tempUserName}! تۆمارەکەت تەواو بوو.`;
                
                // ڕێکخستنەکان پاک بکەوە
                localStorage.clear();
            } else {
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ کۆدی OTP هەڵەیە! تکایە دووبارە هەوڵبدەوە.';
            }
        });
    </script>
</body>
</html>
