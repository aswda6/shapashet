<!DOCTYPE html>
<html lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP لە ڕێگەی ئیمەیڵ - MailJS</title>
    <!-- MailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@mailjs/sdk@latest/dist/mailjs.umd.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #4361ee;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #3a56d4;
        }
        .message {
            margin-top: 15px;
            font-size: 14px;
            color: #2d6a4f;
        }
        .error {
            color: #d62828;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🔐 ناردنی OTP</h2>
    <p>ئیمەیڵەکەت بنووسە</p>
    <input type="email" id="emailInput" placeholder="example@domain.com">
    <button id="sendOtpBtn">ناردنی OTP</button>
    <div id="statusMessage" class="message"></div>
</div>

<script>
    // 📌 Public Key ـت لێرە دابنێ (ئاسایی و خاوێن)
    const MAILJS_PUBLIC_KEY = "your_public_key_here"; // Public Keyـت لە MailJS بگرە

    // 🧪 دروستکردنی OTP (6 ژمارە)
    function generateOTP() {
        return Math.floor(100000 + Math.random() * 900000).toString();
    }

    document.getElementById("sendOtpBtn").onclick = async () => {
        const email = document.getElementById("emailInput").value;
        const messageDiv = document.getElementById("statusMessage");

        if (!email) {
            messageDiv.innerText = "❌ تکایە ئیمەیڵ بنووسە";
            messageDiv.className = "message error";
            return;
        }

        // دروستکردنی OTP
        const otpCode = generateOTP();

        // ئامادەکردنی MailJS Client
        const mailjs = new MailJS(MAILJS_PUBLIC_KEY);

        // ناردنی ئیمەیڵ بە MailJS
        try {
            const sendResult = await mailjs.send({
                from: "your_verified_email@example.com", // ئیمەیڵێک کە لە MailJS پشتڕاستکراوە
                to: email,
                subject: "کۆدی پشتڕاستکردنەوەی OTP",
                text: `OTP کۆدەکەت بریتییە لە: ${otpCode}\nئەم کۆدە 10 خولەک کارادەکات.`,
                html: `<h3>سڵاو</h3><p>کۆدی OTP: <strong>${otpCode}</strong></p><p>تکایە لە ماوەی ١٠ خولەکدا بەکاری بهێنە.</p>`
            });

            if (sendResult.status === 200 || sendResult.success) {
                messageDiv.innerText = `✅ OTP (${otpCode}) بۆ ${email} نێردرا! (تەنها لە console ببینرێت بۆ تاقیکردنەوە)`;
                messageDiv.className = "message";
                // لە رێڕاستدا OTP بۆ Backend بنێرە بۆ پشتڕاستکردنەوە
                console.log("OTP نێردرا:", otpCode);
            } else {
                messageDiv.innerText = "❌ هەڵە لە ناردنی ئیمەیڵ. دڵنیابە لە Public Key و ئیمەیڵی نێردراو.";
                messageDiv.className = "message error";
            }
        } catch (err) {
            console.error(err);
            messageDiv.innerText = "❌ پەیوەندی بە MailJS ڕوونەکرد. Public Key و ناوی ئیمەیڵی ڕەوانەکەر (from) بپشکنە.";
            messageDiv.className = "message error";
        }
    };
</script>

</body>
</html>
