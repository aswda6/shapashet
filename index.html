<!DOCTYPE html>
<html>
<head>
    <title>Test EmailJS</title>
</head>
<body>
    <button onclick="sendEmail()">ناردنی OTP</button>
    <div id="result"></div>

    <script>
    function sendEmail() {
        fetch('https://api.emailjs.com/api/v1.0/email/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                service_id: 'service_0mgxo9b',
                template_id: 'template_vgzbgin',
                user_id: 'B0v39HGtjKuVbFu6R',
                accessToken: '2NYM1Da9MBZ8_dqEBVRfg',
                template_params: {
                    to_email: 'wargame00101@gmail.com',
                    otp: '123456'
                }
            })
        })
        .then(response => response.text())
        .then(data => {
            document.getElementById('result').innerHTML = '✅ کارکرد: ' + data;
        })
        .catch(error => {
            document.getElementById('result').innerHTML = '❌ هەڵە: ' + error;
        });
    }
    </script>
</body>
</html>
